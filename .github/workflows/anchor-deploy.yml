name: Anchor Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0

      - name: Build program
        working-directory: programs
        run: |
          cargo build --release -p streamer-vault 2>&1 | tail -20
          echo "=== Build complete ==="
          echo "=== All files in target/ ==="
          find target/ -type f 2>/dev/null | head -50
          echo "=== Done ==="

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: streamer-vault-build
          path: programs/target/
          if-no-files-found: warn