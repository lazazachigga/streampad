name: Anchor Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0

      - name: Build program
        working-directory: programs
        run: |
          cargo build --release -p streamer-vault 2>&1 | tail -20
          echo "=== Build complete ==="
          echo "=== .so files ==="
          find . -name "*.so" 2>/dev/null
          echo "=== target/release ==="
          ls -la target/release/*.so 2>/dev/null || echo "No .so in target/release"

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamer-vault-so
          path: programs/target/release/*.so