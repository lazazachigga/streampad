name: Anchor Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0

      - name: Create test project
        run: |
          mkdir -p /tmp/test-rust/src
          echo 'fn main() { println!("Hello"); }' > /tmp/test-rust/src/main.rs
          cat > /tmp/test-rust/Cargo.toml << 'EOF'
          [package]
          name = "test-rust"
          version = "0.1.0"
          edition = "2021"

          [[bin]]
          name = "test_rust"
          path = "src/main.rs"
          EOF
          cd /tmp/test-rust
          cargo build 2>&1
          echo "EXIT_CODE: $?"