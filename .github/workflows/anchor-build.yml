name: Anchor Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0

      - name: Build program
        working-directory: programs
        run: |
          cargo build --release -p streamer-vault 2>&1 | tail -20
          echo "=== Build complete ==="
          echo "=== All files in target/ ==="
          find target/ -type f -name "*.so" 2>/dev/null
          find target/ -type f -name "libstreamer*" 2>/dev/null
          echo "=== target/release contents ==="
          ls -la target/release/ 2>/dev/null || echo "No target/release"
          echo "=== Done ==="

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: streamer-vault-build
          path: programs/target/release/