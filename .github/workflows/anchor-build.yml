name: Anchor Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0

      - name: Build with Cargo
        working-directory: programs
        run: |
          cargo build --release -p streamer-vault 2>&1 | tail -30
          echo "=== Build complete ==="
          echo "=== .so files ==="
          find . -name "*.so" 2>/dev/null
          echo "=== target/release ==="
          ls -la target/release/*.so 2>/dev/null || echo "No .so in target/release"
          echo "=== Done ==="