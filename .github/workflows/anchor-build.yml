name: Anchor Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0

      - name: Build program
        working-directory: programs
        run: |
          cargo build --release -p streamer-vault 2>&1 | tail -50
          echo "EXIT_CODE: ${PIPESTATUS[0]}"