name: Anchor Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.82.0
          source $HOME/.cargo/env
          rustc --version
          cargo --version

      - name: Build program
        working-directory: programs/streamer-vault
        run: |
          source $HOME/.cargo/env
          cargo build 2>&1