name: Anchor Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0

      - name: Check files
        working-directory: programs/streamer-vault
        run: |
          echo "=== Cargo.toml ==="
          cat Cargo.toml
          echo "=== src/main.rs ==="
          cat src/main.rs
          echo "=== ls ==="
          ls -la src/

      - name: Build program
        working-directory: programs/streamer-vault
        run: cargo build 2>&1